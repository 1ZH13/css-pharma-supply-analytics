# Verificación de cada pull request antes de aceptarlo.
name: Verificación

on:
  pull_request:
    branches: [develop, qa, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Sintaxis
        run: python -m compileall -q pipeline
      - name: El pipeline importa y responde
        run: python -m pipeline.extract --help
